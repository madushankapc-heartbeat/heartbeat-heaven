<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Studio Login | HEARTBEAT HEAVEN</title>
<link rel="stylesheet" href="/studio-login.css">
</head>
<body>
<div class="login-wrapper">
  <div class="logo">
    <img class="logo-image" src="/heartbeat-heaven-logo.png" alt="HEARTBEAT HEAVEN logo">
    <div class="logo-title">HEARTBEAT HEAVEN</div>
    <div class="logo-subtitle">Original Music by Madushanka</div>
  </div>
  <div class="card">
    <h1 class="heading">Studio Login</h1>
    <p class="description">Sign in to manage songs, covers, audio files and your music library.</p>
    <div id="error" class="error"></div>
    <form id="loginForm">
      <div class="field"><label for="username">Username</label><input id="username" name="username" type="text" autocomplete="username" required autofocus></div>
      <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
      <button id="loginButton" type="submit">Sign In to Studio</button>
    </form>
  </div>
  <div class="footer">HEARTBEAT HEAVEN • Studio</div>
</div>
<script src="/studio-login.js"></script>
</body>
</html>
