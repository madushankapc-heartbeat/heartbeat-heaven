<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090909">
<meta name="robots" content="index, follow">
<meta name="description" content="Explore all original music from Heartbeat Heaven by Madushanka.">
<link rel="canonical" href="https://heartbeat-heaven.onrender.com/songs.html">
<title>Songs — HEARTBEAT HEAVEN</title>
<meta property="og:type" content="website">
<meta property="og:title" content="All Songs | HEARTBEAT HEAVEN">
<meta property="og:description" content="Explore original Sinhala, English, Hindi and Tamil music releases from HEARTBEAT HEAVEN by Madushanka.">
<meta property="og:url" content="https://heartbeat-heaven.onrender.com/songs.html">
<meta property="og:site_name" content="HEARTBEAT HEAVEN">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="All Songs | HEARTBEAT HEAVEN">
<meta name="twitter:description" content="Explore original music releases from HEARTBEAT HEAVEN by Madushanka.">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="/">
    <img src="/heartbeat-heaven-logo.png" alt="HEARTBEAT HEAVEN logo" style="width:40px;height:40px;object-fit:cover;border-radius:50%;display:block;">
    <div><strong>HEARTBEAT HEAVEN</strong><small>Original Music by Madushanka</small></div>
  </a>
  <button class="menu-toggle" id="menuToggle" aria-label="Open menu" aria-expanded="false" aria-controls="mainNav" type="button">☰</button>
  <nav id="mainNav">
    <a href="/">Home</a><a href="/songs.html">Songs</a><a href="/#genres">Genres</a><a href="/#about">About</a>
  </nav>
</header>
<main>
<section class="section songs-library">
  <div class="section-head">
    <div><p class="eyebrow">THE COMPLETE COLLECTION</p><h1>All Songs</h1><p class="library-intro">Explore every original release from Heartbeat Heaven.</p></div>
    <div class="search-wrap"><input id="search" type="search" placeholder="Search songs..." aria-label="Search songs"></div>
  </div>
  <div class="library-filters">
    <button type="button" class="active" data-filter="all">All</button>
    <button type="button" data-filter="Romantic">♥ Romantic</button>
    <button type="button" data-filter="Sad">☾ Sad</button>
    <button type="button" data-filter="Chill">✦ Chill</button>
    <button type="button" data-filter="Cinematic">◈ Cinematic</button>
    <button type="button" data-filter="EDM">⚡ Pop / EDM</button>
    <button type="button" data-filter="Instrumental">♪ Instrumental</button>
  </div>
  <div id="songGrid" class="song-grid"><div class="empty">Loading music…</div></div>
</section>
</main>
<div id="player" class="player hidden">
  <img id="playerCover" src="" alt="">
  <div class="player-info"><strong id="playerTitle">Song</strong><span id="playerArtist">Madushanka</span></div>
  <button id="playBtn" class="round" type="button">▶</button>
  <input id="progress" type="range" min="0" max="100" value="0" aria-label="Song progress">
  <span id="time">0:00</span>
  <button id="closePlayer" class="x" type="button" aria-label="Close audio player">×</button>
  <audio id="audio"></audio>
</div>
<script src="/app.js"></script>
<script>
const menuToggle=document.getElementById("menuToggle"),mainNav=document.getElementById("mainNav");
menuToggle.addEventListener("click",()=>{
  const open=mainNav.classList.toggle("open");
  menuToggle.setAttribute("aria-expanded",String(open));
  menuToggle.setAttribute("aria-label",open?"Close menu":"Open menu");
});
mainNav.querySelectorAll("a").forEach(link=>link.addEventListener("click",()=>{
  mainNav.classList.remove("open");
  menuToggle.setAttribute("aria-expanded","false");
  menuToggle.setAttribute("aria-label","Open menu");
}));
</script>
</body>
</html>
