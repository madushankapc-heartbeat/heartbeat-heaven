<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090909">
<meta name="description" content="Explore all original music from Heartbeat Heaven by Madushanka.">
<title>Songs — HEARTBEAT HEAVEN</title>
<link rel="stylesheet" href="/styles.css">
</head>

<body>

<header class="topbar">
  <a class="brand" href="/">
    <img
      src="/heartbeat-heaven-logo.png"
      alt="HEARTBEAT HEAVEN logo"
      style="width:40px;height:40px;object-fit:cover;border-radius:50%;display:block;"
    >
    <div>
      <strong>HEARTBEAT HEAVEN</strong>
      <small>Original Music by Madushanka</small>
    </div>
  </a>

<button class="menu-toggle" id="menuToggle" aria-label="Open menu">
  ☰
</button>

<nav id="mainNav">
  <a href="/">Home</a>
  <a href="/songs.html">Songs</a>
  <a href="/#genres">Genres</a>
  <a href="/#about">About</a>
</nav>
</header>

<main>

<section class="section songs-library">

  <div class="section-head">

    <div>
      <p class="eyebrow">THE COMPLETE COLLECTION</p>

      <h1>All Songs</h1>

      <p class="library-intro">
        Explore every original release from Heartbeat Heaven.
      </p>
    </div>

    <div class="search-wrap">
      <input
        id="search"
        type="search"
        placeholder="Search songs..."
        aria-label="Search songs"
      >
    </div>

  </div>

  <div class="library-filters">

    <button class="active" data-filter="all">
      All
    </button>

    <button data-filter="Romantic">
      ♥ Romantic
    </button>

    <button data-filter="Sad">
      ☾ Sad
    </button>

    <button data-filter="Chill">
      ✦ Chill
    </button>

    <button data-filter="Cinematic">
      ◈ Cinematic
    </button>

    <button data-filter="EDM">
      ⚡ Pop / EDM
    </button>

    <button data-filter="Instrumental">
      ♪ Instrumental
    </button>

  </div>

  <div id="songGrid" class="song-grid">
    <div class="empty">
      Loading music…
    </div>
  </div>

</section>

</main>

<div id="player" class="player hidden">

  <img
    id="playerCover"
    src=""
    alt=""
  >

  <div class="player-info">

    <strong id="playerTitle">
      Song
    </strong>

    <span id="playerArtist">
      Madushanka
    </span>

  </div>

  <button
    id="playBtn"
    class="round"
    type="button"
  >
    ▶
  </button>

  <input
    id="progress"
    type="range"
    min="0"
    max="100"
    value="0"
    aria-label="Song progress"
  >

  <span id="time">
    0:00
  </span>

  <button
    id="closePlayer"
    class="x"
    type="button"
  >
    ×
  </button>

  <audio id="audio"></audio>

</div>

<script src="/app.js"></script>
<script>
const menuToggle = document.getElementById("menuToggle");
const mainNav = document.getElementById("mainNav");

menuToggle.addEventListener("click", () => {
  mainNav.classList.toggle("open");
});

mainNav.querySelectorAll("a").forEach(link => {
  link.addEventListener("click", () => {
    mainNav.classList.remove("open");
  });
});
</script>
</body>
</html>
