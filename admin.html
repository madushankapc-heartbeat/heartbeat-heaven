<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Studio — Heartbeat Heaven</title><link rel="stylesheet" href="/styles.css"></head>
<body>
<header class="topbar"><a class="brand" href="/"><span>♥</span><div><strong>HEARTBEAT HEAVEN</strong><small>Original Music by Madushanka</small></div></a><nav><a href="/">View Website</a></nav></header>
<main class="admin">
  <div class="admin-head"><div><p class="eyebrow">PRIVATE STUDIO</p><h1>Upload a new song</h1><p>Add your MP3, cover art and lyrics. The website will create the song page automatically.</p></div></div>
  <form id="uploadForm" class="upload-form" enctype="multipart/form-data">
    <label>Song title<input name="title" required placeholder="e.g. නිහඬ රෑක හුස්ම"></label>
    <div class="two"><label>Artist<input name="artist" value="Madushanka"></label><label>Language<select name="language"><option>Sinhala</option><option>English</option><option>Hindi</option><option>Instrumental</option><option>Other</option></select></label></div>
    <div class="two"><label>Genre<select name="genre"><option>Romantic</option><option>Sad</option><option>Chill</option><option>Cinematic</option><option>Pop / EDM</option><option>Instrumental</option><option>Other</option></select></label><label>Mood<input name="mood" value="Romantic"></label></div>
    <label>Short description<textarea name="description" rows="3" placeholder="A short description for the song page"></textarea></label>
    <label>Lyrics<textarea name="lyrics" rows="12" placeholder="Paste your original lyrics here"></textarea></label>
    <div class="two"><label>Audio file<input type="file" name="audio" accept="audio/*" required></label><label>Cover image<input type="file" name="cover" accept="image/*" required></label></div>
    <button class="btn primary" type="submit">Publish Song</button><div id="status"></div>
  </form>
  <section class="admin-list"><h2>Published songs</h2><div id="adminSongs"></div></section>
</main>
<script src="/admin.js"></script>
</body></html>
