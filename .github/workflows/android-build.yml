name: Android App Build

on:
  push:
    branches:
      - feature/android-app
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Enable Java time API desugaring
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle.kts")
          s = p.read_text()
          old = 'compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }'
          new = 'compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17; isCoreLibraryDesugaringEnabled = true }'
          if old not in s:
              raise SystemExit("compileOptions pattern not found")
          s = s.replace(old, new, 1)
          marker = '    debugImplementation("androidx.compose.ui:ui-tooling")'
          dep = '    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.2")\n'
          if dep.strip() not in s:
              if marker not in s:
                  raise SystemExit("dependency marker not found")
              s = s.replace(marker, dep + marker, 1)
          p.write_text(s)
          PY

      - name: Create temporary release signing key
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/heartbeat-heaven-release.jks" \
            -storepass "heartbeat-heaven-ci" \
            -keypass "heartbeat-heaven-ci" \
            -alias "heartbeat-heaven" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=HEARTBEAT HEAVEN, O=HeartBeat Heaven"

      - name: Build signed release APK
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/heartbeat-heaven-release.jks
          RELEASE_STORE_PASSWORD: heartbeat-heaven-ci
          RELEASE_KEY_ALIAS: heartbeat-heaven
          RELEASE_KEY_PASSWORD: heartbeat-heaven-ci
        run: gradle :app:assembleRelease --stacktrace

      - name: Validate APK package and signature
        shell: bash
        run: |
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/mobile/app/build/outputs/apk/release/app-release.apk"
          BUILD_TOOLS_DIR="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          echo "APK: $APK"
          ls -lh "$APK"
          echo "Build tools: $BUILD_TOOLS_DIR"
          "$BUILD_TOOLS_DIR/aapt2" dump packagename "$APK"
          "$BUILD_TOOLS_DIR/zipalign" -c -P 16 -v 4 "$APK"
          "$BUILD_TOOLS_DIR/apksigner" verify --verbose --print-certs "$APK"

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: heartbeat-heaven-release-apk
          path: mobile/app/build/outputs/apk/release/app-release.apk
