name: Android App Build

on:
  push:
    branches:
      - feature/android-app
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Apply player progress fix
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('mobile/app/src/main/java/com/heartbeatheaven/app/MainActivity.kt')
          s = p.read_text()
          old = '''        setContent {
            HeartbeatTheme {
                HeartbeatApp(
                    currentSongId, currentSong, isPlaying, positionMs, durationMs,
                    ::play, ::pause, ::seekTo, ::stop
                )
            }
        }'''
          new = '''        setContent {
            HeartbeatTheme {
                LaunchedEffect(currentSongId, isPlaying) {
                    while (currentSongId != null) {
                        positionMs = player?.currentPosition?.coerceAtLeast(0L) ?: positionMs
                        durationMs = player?.duration?.takeIf { it > 0 } ?: durationMs
                        delay(if (isPlaying) 250L else 500L)
                    }
                }
                HeartbeatApp(
                    currentSongId, currentSong, isPlaying, positionMs, durationMs,
                    ::play, ::pause, ::seekTo, ::stop
                )
            }
        }'''
          if old in s:
              s = s.replace(old, new, 1)
          old_effect = '''    LaunchedEffect(currentSongId, isPlaying) {
        while (currentSongId != null) {
            if (isPlaying) {
                delay(500)
                // Position is supplied by the Activity through the player callback loop.
                // The Activity state is refreshed here through the lightweight public API below.
            } else delay(700)
        }
    }

'''
          if old_effect in s:
              s = s.replace(old_effect, '', 1)
          p.write_text(s)
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mobile/app/src/main/java/com/heartbeatheaven/app/MainActivity.kt
          if ! git diff --cached --quiet; then
            git commit -m 'fix(android): update player progress in real time'
            git push origin feature/android-app
          else
            echo 'Player progress fix already present.'
          fi

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Validate APK package and signature
        shell: bash
        run: |
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/mobile/app/build/outputs/apk/debug/app-debug.apk"
          BUILD_TOOLS_DIR="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          echo "APK: $APK"
          ls -lh "$APK"
          echo "Build tools: $BUILD_TOOLS_DIR"
          "$BUILD_TOOLS_DIR/aapt2" dump packagename "$APK"
          "$BUILD_TOOLS_DIR/zipalign" -c -P 16 -v 4 "$APK"
          "$BUILD_TOOLS_DIR/apksigner" verify --verbose --print-certs "$APK"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: heartbeat-heaven-debug-apk
          path: mobile/app/build/outputs/apk/debug/app-debug.apk
