name: Android App Build

on:
  push:
    branches:
      - feature/android-app
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Validate APK package and signature
        shell: bash
        run: |
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/mobile/app/build/outputs/apk/debug/app-debug.apk"
          BUILD_TOOLS_DIR="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          echo "APK: $APK"
          ls -lh "$APK"
          echo "Build tools: $BUILD_TOOLS_DIR"
          "$BUILD_TOOLS_DIR/aapt2" dump packagename "$APK"
          "$BUILD_TOOLS_DIR/zipalign" -c -P 16 -v 4 "$APK"
          "$BUILD_TOOLS_DIR/apksigner" verify --verbose --print-certs "$APK"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: heartbeat-heaven-debug-apk
          path: mobile/app/build/outputs/apk/debug/app-debug.apk
