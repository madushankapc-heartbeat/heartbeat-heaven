name: Fix Player Progress and Build APK

on:
  push:
    branches: [feature/android-app]

permissions:
  contents: write

env:
  JAVA_VERSION: '17'

jobs:
  fix-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/android-app

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Fix player progress state updates
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('mobile/app/src/main/java/com/heartbeatheaven/app/MainActivity.kt')
          s = p.read_text()
          old = '''        setContent {
            HeartbeatTheme {
                HeartbeatApp(
                    currentSongId, currentSong, isPlaying, positionMs, durationMs,
                    ::play, ::pause, ::seekTo, ::stop
                )
            }
        }'''
          new = '''        setContent {
            HeartbeatTheme {
                LaunchedEffect(currentSongId, isPlaying) {
                    while (currentSongId != null) {
                        positionMs = player?.currentPosition?.coerceAtLeast(0L) ?: positionMs
                        durationMs = player?.duration?.takeIf { it > 0 } ?: durationMs
                        delay(if (isPlaying) 250L else 500L)
                    }
                }
                HeartbeatApp(
                    currentSongId, currentSong, isPlaying, positionMs, durationMs,
                    ::play, ::pause, ::seekTo, ::stop
                )
            }
        }'''
          if old not in s:
              raise SystemExit('Expected setContent block was not found')
          s = s.replace(old, new, 1)
          old_effect = '''    LaunchedEffect(currentSongId, isPlaying) {
        while (currentSongId != null) {
            if (isPlaying) {
                delay(500)
                // Position is supplied by the Activity through the player callback loop.
                // The Activity state is refreshed here through the lightweight public API below.
            } else delay(700)
        }
    }

'''
          if old_effect in s:
              s = s.replace(old_effect, '', 1)
          p.write_text(s)
          PY

      - name: Commit player progress fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mobile/app/src/main/java/com/heartbeatheaven/app/MainActivity.kt
          git commit -m 'fix(android): update player progress in real time'
          git push origin feature/android-app

      - name: Build debug APK
        working-directory: mobile
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: heartbeat-heaven-debug-apk-progress-fix
          path: mobile/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90

      - name: Remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/fix-player-progress.yml
          git add .github/workflows/fix-player-progress.yml
          git commit -m 'chore(android): remove temporary player fix workflow'
          git push origin feature/android-app