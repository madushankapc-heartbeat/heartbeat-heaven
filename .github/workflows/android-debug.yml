name: Android Release APK

on:
  push:
    branches:
      - feature/android-app
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Create temporary release signing key
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/heartbeat-heaven-release.jks" \
            -storepass "heartbeat-heaven-ci" \
            -keypass "heartbeat-heaven-ci" \
            -alias "heartbeat-heaven" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=HEARTBEAT HEAVEN, O=HeartBeat Heaven"

      - name: Build signed release APK
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/heartbeat-heaven-release.jks
          RELEASE_STORE_PASSWORD: heartbeat-heaven-ci
          RELEASE_KEY_ALIAS: heartbeat-heaven
          RELEASE_KEY_PASSWORD: heartbeat-heaven-ci
        run: gradle assembleRelease --stacktrace

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: heartbeat-heaven-release-apk
          path: mobile/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
